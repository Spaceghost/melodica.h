name: SaC probation

on:
  push:
    branches: [master]
    paths:
      - 'lab/sac/**'
      - '.github/workflows/sac-probation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melodica-sac-probation
  cancel-in-progress: true

jobs:
  build-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild SaC for runner baseline and expose generated C ABI
        shell: bash
        run: |
          set -euxo pipefail
          docker pull sacbase/sac-jupyter-notebook:latest
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            --entrypoint bash sacbase/sac-jupyter-notebook:latest -lc '
              set -euxo pipefail
              SRC=/home/jovyan/sac2c
              OLD_BUILD="$SRC/build"

              echo "=== bundled SaC source ==="
              test -d "$SRC"
              ls -la "$SRC" | head -100
              echo "=== bundled build targets ==="
              cmake --build "$OLD_BUILD" --target help | sed -n "1,220p"
              echo "=== old CPU/config flags ==="
              grep -E "(^CMAKE_(C|CXX)_FLAGS|march|mtune|NATIVE|SAC4C)" \
                "$OLD_BUILD/CMakeCache.txt" | head -120 || true

              # The notebook image was built with host-specific instructions and
              # SIGILLs on GitHub runners. Reconfigure from its bundled source
              # for the x86-64 baseline instead of trusting the binary image.
              rm -rf /tmp/sac2c-generic
              cmake -S "$SRC" -B /tmp/sac2c-generic \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-O2 -march=x86-64 -mtune=generic" \
                -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -mtune=generic"

              echo "=== generic build targets ==="
              cmake --build /tmp/sac2c-generic --target help | sed -n "1,220p"

              SAC2C_TARGET=$(cmake --build /tmp/sac2c-generic --target help | \
                sed -n "s/^\.\.\. \(sac2c_[A-Za-z0-9_]*\)$/\1/p" | head -n1)
              SAC4C_TARGET=$(cmake --build /tmp/sac2c-generic --target help | \
                sed -n "s/^\.\.\. \(sac4c_[A-Za-z0-9_]*\)$/\1/p" | head -n1)
              test -n "$SAC2C_TARGET"
              test -n "$SAC4C_TARGET"
              cmake --build /tmp/sac2c-generic -j2 --target "$SAC2C_TARGET" "$SAC4C_TARGET"

              SAC2C_BIN=$(find /tmp/sac2c-generic -type f -name "sac2c_*" -perm -111 | head -n1)
              SAC4C_BIN=$(find /tmp/sac2c-generic -type f -name "sac4c_*" -perm -111 | head -n1)
              test -n "$SAC2C_BIN"
              test -n "$SAC4C_BIN"
              "$SAC2C_BIN" -V
              "$SAC4C_BIN" -V

              rm -rf lab/sac/cmake-common build/sac
              git clone --depth=1 https://github.com/SacBase/cmake-common.git lab/sac/cmake-common
              cmake -S lab/sac -B build/sac \
                -DTARGET=seq \
                -DSAC2C_EXEC="$SAC2C_BIN" \
                -DSAC4C_EXEC="$SAC4C_BIN"
              cmake --build build/sac --verbose
              echo "=== GENERATED HEADER ==="
              cat build/sac/sacwrapper-FindString.h
              echo "=== OUTPUT TREE ==="
              find build/sac -maxdepth 6 -type f -printf "%s %p\n" | sort -n
            '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sac-probation
          path: build/sac/
