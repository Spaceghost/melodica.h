name: compare implementations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-shootout:
    runs-on: ubuntu-latest
    env:
      ODIN_VERSION: dev-2026-09
      ODIN_SHA256: 167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      NELUA_REV: a58450563e2d2ec49bff499865c8b5cfdf6ff81a

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Odin
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/odin.tar.gz"
          curl -fsSL \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            -o "$archive"
          echo "${ODIN_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/odin" --strip-components=1
          test -x "$RUNNER_TEMP/odin/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Install pinned Zig
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            -o "$archive"
          echo "${ZIG_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          test -x "$RUNNER_TEMP/zig/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install pinned Nelua
        shell: bash
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/nelua"
          git init "$src"
          git -C "$src" remote add origin https://github.com/edubart/nelua-lang.git
          git -C "$src" fetch --depth=1 origin "$NELUA_REV"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$NELUA_REV"
          make -C "$src" -j"$(nproc)"
          test -x "$src/nelua"
          test -x "$src/nelua-lua"
          echo "$src" >> "$GITHUB_PATH"

      - name: Build all native controls and libpiano compatibility
        run: make test

      - name: Prove portable C core across freestanding targets
        run: make portable

      - name: Emit strict C99 with Codin and test with GCC + Clang
        run: make codin-check

      - name: Benchmark portable C
        run: make bench-c

      - name: Benchmark native Odin
        run: make bench-odin

      - name: Benchmark Zig
        run: make bench-zig

      - name: Benchmark Nelua
        run: make bench-nelua

      - name: Benchmark Codin C99 via GCC
        run: ./build/codin/bench

      - name: Report artifact sizes
        shell: bash
        run: |
          set -eu
          printf '%-28s %12s\n' lane bytes
          printf '%-28s %12s\n' c99-header-core "$(stat -c %s build/c/libmelodica.a)"
          printf '%-28s %12s\n' libpiano-compat "$(stat -c %s build/compat/libpiano.a)"
          printf '%-28s %12s\n' zig "$(stat -c %s build/zig/libmelodica.a)"
          printf '%-28s %12s\n' nelua "$(stat -c %s build/nelua/libmelodica.a)"
          printf '%-28s %12s\n' wasm32-clang "$(stat -c %s build/portable/wasm32-clang.o)"
          printf '%-28s %12s\n' wasm32-zigcc "$(stat -c %s build/portable/wasm32-zigcc.o)"
          printf '%-28s %12s\n' aarch64-linux-musl-zigcc "$(stat -c %s build/portable/aarch64-linux-musl.o)"
          printf '%-28s %12s\n' x86_64-windows-zigcc "$(stat -c %s build/portable/x86_64-windows-gnu.o)"
          printf '%-28s %12s\n' odin "$(stat -c %s build/odin/libmelodica.a)"
          printf '%-28s %12s\n' codin-native-control "$(stat -c %s build/codin-native/libmelodica.a)"
          printf '%-28s %12s\n' codin-c99-gcc "$(stat -c %s build/codin/melodica.gcc.o)"
          printf '%-28s %12s\n' codin-c99-clang "$(stat -c %s build/codin/melodica.clang.o)"
          printf '%-28s %12s\n' codin-c99-source "$(stat -c %s build/codin/melodica.c)"

  pianobar-source-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pianobar build headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libao-dev libcurl4-openssl-dev libgcrypt20-dev libjson-c-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev

      - name: Compile real pianobar application sources against melodica piano.h
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/PromyLOPh/pianobar.git "$RUNNER_TEMP/pianobar"
          make -C "$RUNNER_TEMP/pianobar" \
            LIBPIANO_INCLUDE="$GITHUB_WORKSPACE/include" \
            CFLAGS='-O2 -DNDEBUG -Wall -Wextra -DMELODICA_PIANO_LEGACY_GCRYPT' \
            src/main.o src/debug.o src/settings.o src/terminal.o \
            src/ui_act.o src/ui.o src/ui_readline.o src/ui_dispatch.o
