name: compare implementations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-shootout:
    runs-on: ubuntu-latest
    env:
      ODIN_VERSION: dev-2026-09
      ODIN_SHA256: 167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Odin
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/odin.tar.gz"
          curl -fsSL \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            -o "$archive"
          echo "${ODIN_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/odin" --strip-components=1
          test -x "$RUNNER_TEMP/odin/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Build all native controls and libpiano compatibility
        run: make test

      - name: Prove portable C core is freestanding and wasm-compilable
        run: make portable

      - name: Emit strict C99 with Codin and test with GCC + Clang
        run: make codin-check

      - name: Benchmark portable C
        run: make bench-c

      - name: Benchmark native Odin
        run: make bench-odin

      - name: Benchmark Codin C99 via GCC
        run: ./build/codin/bench

      - name: Report artifact sizes
        shell: bash
        run: |
          set -eu
          printf '%-24s %12s\n' lane bytes
          printf '%-24s %12s\n' c99-header-core "$(stat -c %s build/c/libmelodica.a)"
          printf '%-24s %12s\n' libpiano-compat "$(stat -c %s build/compat/libpiano.a)"
          printf '%-24s %12s\n' wasm32-core-object "$(stat -c %s build/portable/wasm32.o)"
          printf '%-24s %12s\n' odin "$(stat -c %s build/odin/libmelodica.a)"
          printf '%-24s %12s\n' codin-native-control "$(stat -c %s build/codin-native/libmelodica.a)"
          printf '%-24s %12s\n' codin-c99-gcc "$(stat -c %s build/codin/melodica.gcc.o)"
          printf '%-24s %12s\n' codin-c99-clang "$(stat -c %s build/codin/melodica.clang.o)"
          printf '%-24s %12s\n' codin-c99-source "$(stat -c %s build/codin/melodica.c)"
