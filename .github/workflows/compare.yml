name: compare implementations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted

permissions:
  contents: read
concurrency:
  group: melodica-compare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  language-shootout:
    # Fork code is not admitted to a persistent self-hosted trust domain automatically.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","ubuntu-tiny","spaceghost-melodica.h"]') }}
    timeout-minutes: 45
    env:
      CC: gcc
      CLANG: clang
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install worker build dependencies
        id: deps
        run: sh scripts/ci-deps.sh native
      - name: Test CI failure handling
        id: harness
        run: python3 -m unittest discover -s tests -p test_ci.py -v
      - name: Install and verify every pinned language toolchain
        id: tools
        run: bash scripts/ci-toolchains.sh
      - name: Rebuild and independently test every native lane, then benchmark
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: python3 scripts/native-ci.py
      - name: Prove portable C core across freestanding targets
        run: make portable
      - name: Retain logs, exact inputs, artifacts, dependencies and standings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native-evidence/
            build/toolchain-evidence/
            build/shootout/
            build/c/
            build/odin/
            build/zig/
            build/nelua/
            build/codin/
            build/portable/
          if-no-files-found: warn
          retention-days: 14

  pianobar-source-compat:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","ubuntu-tiny","spaceghost-melodica.h"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned-reference build dependencies
        run: sh scripts/ci-deps.sh reference
      - name: Compile real pinned pianobar sources against melodica piano.h
        shell: bash
        run: |
          set -euo pipefail
          rev=$(cat tests/reference/pianobar.rev)
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]]
          src="$RUNNER_TEMP/pianobar-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/PromyLOPh/pianobar.git
          git -C "$src" fetch --depth=1 origin "$rev"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$rev"
          make -C "$src" \
            LIBPIANO_INCLUDE="$GITHUB_WORKSPACE/include" \
            CFLAGS='-O2 -DNDEBUG -Wall -Wextra -DMELODICA_PIANO_LEGACY_GCRYPT' \
            src/main.o src/debug.o src/settings.o src/terminal.o \
            src/ui_act.o src/ui.o src/ui_readline.o src/ui_dispatch.o
