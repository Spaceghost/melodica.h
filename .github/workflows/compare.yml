name: compare implementations

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      runner:
        description: Execution backend
        type: string
        default: self-hosted
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted

permissions:
  contents: read
concurrency:
  group: melodica-compare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  language-shootout:
    concurrency:
      group: melodica-worker-${{ github.repository }}
      queue: max
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64","fedora44","spaceghost-melodica.h"]') }}
    timeout-minutes: 45
    env:
      CC: gcc
      CLANG: clang
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install worker build dependencies
        id: deps
        run: sh scripts/ci-deps.sh native
      - name: Test CI failure handling
        id: harness
        run: python3 -m unittest discover -s tests -p 'test_ci*.py' -v
      - name: Install and verify every pinned language toolchain
        id: tools
        run: bash scripts/ci-toolchains.sh
      - name: Rebuild and independently test every native lane, then benchmark
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: python3 scripts/native-ci.py
      - name: Prove portable C core across freestanding targets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: make portable
      - name: Preserve readable evidence in job logs
        if: always()
        run: python3 scripts/ci-evidence.py build/native-evidence build/toolchain-evidence build/shootout
      - name: Retain logs, exact inputs, artifacts, dependencies and standings
        id: evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native-evidence/
            build/toolchain-evidence/
            build/shootout/
            build/c/
            build/odin/
            build/zig/
            build/nelua/
            build/codin/
            build/portable/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
      - name: Report artifact service failure
        if: ${{ always() && steps.evidence.outcome == 'failure' }}
        run: |
          echo '::warning::Artifact upload failed. Validation evidence is preserved in the job logs.'
          echo 'Artifact upload failed; inspect the Preserve readable evidence step in this run.' >> "$GITHUB_STEP_SUMMARY"

  pianobar-source-compat:
    concurrency:
      group: melodica-worker-${{ github.repository }}
      queue: max
    runs-on: ${{ inputs.runner == 'github-hosted' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64","fedora44","spaceghost-melodica.h"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned-reference build dependencies
        run: sh scripts/ci-deps.sh reference
      - name: Compile real pinned pianobar sources against melodica piano.h
        run: sh scripts/pianobar-source-compat.sh
      - name: Preserve readable consumer evidence in job logs
        if: always()
        run: python3 scripts/ci-evidence.py build/pianobar-source-evidence
      - name: Retain unchanged consumer compatibility evidence
        id: consumer-evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pianobar-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pianobar-source-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
      - name: Report consumer artifact service failure
        if: ${{ always() && steps.consumer-evidence.outcome == 'failure' }}
        run: |
          echo '::warning::Artifact upload failed. Consumer evidence is preserved in the job logs.'
          echo 'Consumer artifact upload failed; inspect the Preserve readable consumer evidence step.' >> "$GITHUB_STEP_SUMMARY"
