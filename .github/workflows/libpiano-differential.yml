name: libpiano differential compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted

permissions:
  contents: read
concurrency:
  group: melodica-differential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: incus-spaceghost-melodica.h
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install reference dependencies
        run: sh scripts/ci-deps.sh reference
      - name: Test libpiano, crypto, JSON, playlist safety and independent wire oracle
        run: make test-blowfish test-crypt test-json test-libpiano test-playlist-alloc test-playlist-wire
      - name: Check playlist ownership with ASan and UBSan
        run: make test-playlist-sanitize
      - name: Compare pinned upstream behavior and complete playlist workloads
        run: sh scripts/libpiano-differential.sh
      - name: Retain reference, candidate, timings and size evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libpiano-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/libpiano-evidence/
          if-no-files-found: warn
          retention-days: 14
