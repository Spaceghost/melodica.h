name: libpiano differential compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install reference dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libgcrypt20-dev libjson-c-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libao-dev

      - name: Test libpiano, playlist safety, and independent wire oracle
        run: make test-libpiano test-playlist-alloc test-playlist-wire

      - name: Check playlist ownership with ASan and UBSan
        run: make test-playlist-sanitize

      - name: Compare pinned upstream behavior and complete playlist workloads
        run: sh scripts/libpiano-differential.sh

      - name: Retain reference, candidate, timings, and size evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libpiano-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/libpiano-evidence/
          if-no-files-found: warn
          retention-days: 14
