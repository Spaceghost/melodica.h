name: source-language bake-off

on:
  push:
    branches: [master]
    paths:
      - 'lab/**'
      - '!lab/BENCHMARK.tsv'
      - '!lab/WINNER'
      - 'tools/language-bakeoff.sh'
      - '.github/workflows/language-bakeoff.yml'
      - 'tools/bootstrap-nelua.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: melodica-language-bakeoff
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest
      - name: Cache pinned Nelua compiler
        uses: actions/cache@v4
        with:
          path: .cache/nelua-lang
          key: melodica-nelua-${{ runner.os }}-${{ hashFiles('tools/bootstrap-nelua.sh') }}
      - name: Compare implementations
        run: ./tools/language-bakeoff.sh
      - name: Publish lab result
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- lab/BENCHMARK.tsv lab/WINNER)" ]]; then
            exit 0
          fi
          winner=$(cat lab/WINNER)
          git config user.name "melodica language bake-off"
          git config user.email "actions@users.noreply.github.com"
          git add lab/BENCHMARK.tsv lab/WINNER
          git commit -m "language-bakeoff: ${winner} wins string lookup"
          git push origin HEAD:master
