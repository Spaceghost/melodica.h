name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - scripts/release/**
      - tests/release-publisher.test.mjs
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  NELUA_REPO: https://github.com/Spaceghost/nelua-lang
  NELUA_SHA: 7fe8132893f9f2bbce3a7b23247ad8bde2c216ed
  # Chrome extension id derived from CRX_PRIVATE_KEY (scripts/crx-id.mjs); the build fails if the secret derives another.
  CRX_ID: obbahflgghfemmpmjppeibnemibgblbd

jobs:
  build:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      # secrets are not allowed in a step's if:, so the check lives here.
      HAS_AMO: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Toolchain (clang + lld for wasm32, Jack's Nelua fork)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq lld clang && break; sleep 20; done
          clang --version | head -1; wasm-ld --version
          git clone -q "$NELUA_REPO" "$RUNNER_TEMP/nelua-lang"
          git -C "$RUNNER_TEMP/nelua-lang" checkout -q "$NELUA_SHA"
          make -C "$RUNNER_TEMP/nelua-lang" -j"$(nproc)" >/dev/null
          "$RUNNER_TEMP/nelua-lang/nelua" --version
      - name: Build the wasm core (Nelua -> C -> clang wasm32)
        run: scripts/build-core.sh
        env:
          NELUA: ${{ runner.temp }}/nelua-lang/nelua
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: Build the extension (Imba -> ES modules)
        run: node scripts/build.mjs --version "${{ steps.v.outputs.version }}"
      - name: Core unit test (libpiano vector, reference Blowfish, syncTime, envelope)
        run: node core/test.mjs
      - name: Account unit test (PKCE, authorize URL, redirect, tokens, policy, label)
        run: node tests/account.test.mjs
      - name: Update awareness unit test (version compare, feeds, banner)
        run: node tests/update.test.mjs
      - name: Scrobbles unit test (listen metadata, 50% / 4 min)
        run: node tests/scrobble.test.mjs
      - name: Release completion checks
        run: npm run test:release-sites
      - name: Playback transfer and byte-copy validation
        run: npm run test:transfer
      - name: Native Rooms engine and public-state contracts
        run: node --test tests/room-engine.test.mjs tests/room-state.test.mjs tests/room-role.test.mjs
      - name: Shared UI pin updater validation
        run: npm run test:ui-pin
      - name: listen:// parser test (melodica-scrobble's reference test, unchanged)
        run: node --test tests/listen-uri.test.mjs
      - name: Shared Scrobbles UI pin at most one release behind live (melodica-scrobble check-ui-pin)
        run: |
          curl -fsS -A "melodica-ci" https://spacegho.st/scrobble/assets/ui/latest.json -o latest.json
          node scripts/check-ui-pin.mjs vendor/scrobble-ui/scrobble-ui.js latest.json
      - name: Design lint (no colored single side on any element)
        run: node scripts/lint-edges.mjs public/*.css
      - name: Firefox manifest lint (web-ext)
        run: npx web-ext lint --source-dir dist/firefox --self-hosted
      - name: Package (zips, .xpi, .crx signed with CRX_PRIVATE_KEY, source tarball)
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          v="${{ steps.v.outputs.version }}"
          if [[ -n "$CRX_PRIVATE_KEY" ]]; then
            (umask 077; printf '%s\n' "$CRX_PRIVATE_KEY" > "$RUNNER_TEMP/crx.pem")
            export CRX_KEY="$RUNNER_TEMP/crx.pem"
            id="$(node scripts/crx-id.mjs "$CRX_KEY")"
            [[ "$id" == "$CRX_ID" ]] || { echo "::error::CRX_PRIVATE_KEY derives id $id, expected $CRX_ID"; exit 1; }
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::CRX_PRIVATE_KEY is not set; a release needs the .crx"; exit 1
          else
            echo "::warning::CRX_PRIVATE_KEY is not set; no .crx in this branch build"
          fi
          OUT="$PWD/release" scripts/package.sh "$v"
          rm -f "$RUNNER_TEMP/crx.pem"
      # Mozilla signing happens only on tags and only when the repository has AMO API
      # credentials (secrets AMO_JWT_ISSUER + AMO_JWT_SECRET). Without them the .xpi stays
      # unsigned and the notes say so. `unlisted` keeps it off addons.mozilla.org listings.
      # Branch builds are not signed: every one of them is version 0.0.0 to AMO, which
      # takes a version once (the master build after v0.1.4 failed there with "Not Found").
      - name: Sign the .xpi with AMO (tags only, when AMO_JWT_ISSUER/AMO_JWT_SECRET exist)
        if: env.HAS_AMO == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          v="${{ steps.v.outputs.version }}"
          npx web-ext sign --channel unlisted --source-dir dist/firefox --artifacts-dir "$RUNNER_TEMP/signed" \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          signed="$(ls "$RUNNER_TEMP"/signed/*.xpi | head -1)"
          [[ -s "$signed" ]] || { echo "::error::web-ext sign produced no .xpi"; exit 1; }
          cp "$signed" "release/melodica-extension-$v.xpi"
          echo amo > release/SIGNED
          ( cd release && sha256sum melodica-extension-*.zip melodica-extension-*.xpi melodica-extension-*.crx melodica-extension-*-src.tar.gz > SHA256SUMS )
      - name: Release notes
        run: |
          v="${{ steps.v.outputs.version }}"
          if [[ -f release/SIGNED ]]; then
            xpi_note="Signed by Mozilla (AMO, unlisted channel): installs in any Firefox 128+ from the link above."
          else
            xpi_note="**Not signed by Mozilla** (this repository has no AMO credentials). Release Firefox refuses unsigned add-ons; it installs on Firefox Developer Edition, Nightly or ESR with \`xpinstall.signatures.required\` set to \`false\` in about:config, or temporarily (until Firefox quits) through about:debugging → This Firefox → Load Temporary Add-on."
          fi
          crx_note="CRX3 of the Chrome build, signed with this repository's key; Chrome extension id \`$CRX_ID\`, update feed \`https://spacegho.st/extensions/dl/melodica-extension/update.xml\` (the \`update_url\` in its manifest). On Linux: chrome://extensions (brave://extensions, edge://extensions) → Developer mode on → drag the file onto the page. Windows and macOS Chrome, Edge and Brave block off-store .crx installs unless an enterprise policy allows them (\`ExtensionInstallSources\` + \`ExtensionInstallForcelist\` pointing at that update.xml; Brave honours the same Chromium policies); otherwise use the unpacked zip."
          [[ -f release/melodica-extension-$v.crx ]] || crx_note="not built in this run (no CRX_PRIVATE_KEY)."
          {
            echo "melodica-extension $v: a Pandora WebExtension for Chrome, Brave and Firefox (Manifest V3)."
            echo
            echo "**Access:** sign in with your Pandora account; access follows spacegho.st's allowlist. Optional spacegho.st sign-in links your listening and crew views. Installs and update feeds are served from spacegho.st/extensions (docs/STORES.md)."
            echo
            echo "UI and extension scripts are written in [Imba](https://imba.io) and bundled to plain ES modules; the protocol core (Blowfish with Pandora's public partner keys, hex, syncTime, the JSON v5 request envelope) is freestanding [Nelua](https://github.com/Spaceghost/nelua-lang) compiled to WebAssembly with no imports. The extension talks to \`tuner.pandora.com\` directly through its host permission, so no relay sees the login, and it bridges the web client at https://spacegho.st/melodica/app/ so that page can skip its relay too."
            echo
            echo "Install page with buttons, checksums and the CI proof: https://spacegho.st/melodica/extension/"
            echo
            echo "## Assets"
            echo
            echo "- \`melodica-extension-$v.xpi\`: the Firefox add-on (Firefox shows its install prompt when served as application/x-xpinstall; gecko id \`melodica-extension@spacegho.st\`, update feed \`https://spacegho.st/extensions/dl/melodica-extension/updates.json\`). $xpi_note"
            echo "- \`melodica-extension-$v.crx\`: $crx_note"
            echo "- \`melodica-extension-$v-chrome.zip\`: unpacked extension for Chrome/Chromium/Edge/Brave. Unzip, then chrome://extensions (edge://extensions, brave://extensions) → Developer mode → Load unpacked. Brave uses this Chrome build unchanged."
            echo "- \`melodica-extension-$v-firefox.zip\`: the same build with \`browser_specific_settings\` for Firefox (identical bytes to the unsigned .xpi). Unzip, then about:debugging → This Firefox → Load Temporary Add-on (pick manifest.json), or \`web-ext run --source-dir\`."
            echo "- \`melodica-extension-$v-src.tar.gz\`: source tree."
            echo "- \`SHA256SUMS\`"
            echo "- \`smoke-extension.json\`, \`smoke-extension-slot.png\`, \`smoke-extension-access-request.png\`, \`smoke-extension-account.png\`, \`smoke-extension-login.png\`, \`smoke-extension-stations.png\`, \`smoke-extension-playing.png\`, \`smoke-extension-popup-playing.png\`, \`smoke-extension-player-tab.png\`, \`smoke-extension-bridge.png\`: the Chromium proof below."
            echo "- \`smoke-brave.json\`, \`smoke-brave-slot.png\`, \`smoke-brave-access-request.png\`, \`smoke-brave-account.png\`, \`smoke-brave-login.png\`, \`smoke-brave-stations.png\`, \`smoke-brave-playing.png\`, \`smoke-brave-popup-playing.png\`, \`smoke-brave-player-tab.png\`, \`smoke-brave-bridge.png\`: the same proof in Brave (its \`browser\` field is the Brave version the job installed)."
            echo "- \`smoke-firefox.json\`, \`smoke-firefox-slot.png\`, \`smoke-firefox-access-request.png\`, \`smoke-firefox-account.png\`, \`smoke-firefox-login.png\`, \`smoke-firefox-stations.png\`, \`smoke-firefox-playing.png\`, \`smoke-firefox-popup-playing.png\`, \`smoke-firefox-player-tab.png\`, \`smoke-firefox-real-pandora.png\`, \`smoke-firefox-node-probe.json\`: the Firefox proof below (its \`browser\` field is the Mozilla Firefox the job installed; \`realPandora\` and the node probe are the no-account checks against tuner.pandora.com itself)."
            echo
            echo "## Proof"
            echo
            echo "The \`smoke\` job of this release's workflow loaded this exact Chrome build unpacked into Playwright's Chromium (headed under xvfb). The update banner: with the local spacegho.st serving a releases.json that names version 99.0.0, the popup showed \"melodica 99.0.0 is available\" linking to the store page (the banner every install gets, including unpacked zips; .crx/policy and Firefox installs also update themselves from the feeds). Access and the optional account ran against \`tests/fake-account.mjs\`, a stand-in for spacegho.st built to docs/ACCOUNT.md; the real spacegho.st and a real GitHub sign-in are not exercised anywhere in CI, and launchWebAuthFlow's own window is not driven (the smoke runs the same two steps, account-begin and account-finish, around a browser tab). Then, against [melodica-tuner](https://github.com/Spaceghost/melodica-tuner), a stand-in tuner.pandora.com: set the endpoint on the options page; a login with an email not on the access allow-list was refused with \"melodica access is by allow-list. Your request has been sent.\" and no \`auth.userLogin\` reached the tuner (\`smoke-extension-access-request.png\`); once listed, signed in from the popup, listed the fixture's stations, started a station: no tab opened, the background played it in its offscreen document (chrome.offscreen, AUDIO_PLAYBACK) and the popup showed the track; with every extension page closed the service worker reported the state still playing and the position advancing (\`audio.noPage\` in the report), a new popup showed the track (\`smoke-extension-popup-playing.png\`), the optional player tab showed the same track with no \`<audio>\` of its own (\`smoke-extension-player-tab.png\`) and closing it changed nothing. Then it bridged an \`auth.partnerLogin\` for the melodica-web page served locally as https://spacegho.st, and that page subscribed to the playback state, paused and resumed the music over the bridge (docs/BRIDGE.md; no audio URL reached the page). Then the optional spacegho.st sign-in (PKCE; GitHub on the fake authorize page; \`smoke-extension-account.png\`), token refresh with rotation, sign-out with revocation, and access withdrawn: the next check stopped the music and signed out of Pandora. \`smoke-extension.json\` is the report. The \`smoke-brave\` job repeated every step in Brave (the current stable from Brave's apt repository, Shields at their defaults) with the same Chrome build; \`smoke-brave.json\` is its report and its \`blocked\` list holds every request Brave refused (none of them may be the extension's, the tuner's or the page's, or the job fails). The \`smoke-firefox\` job installed the \`dist/firefox\` build (the bytes of the -firefox.zip and of the unsigned .xpi) as a temporary add-on in the current Mozilla Firefox from packages.mozilla.org, headless, through geckodriver: it checked that Firefox granted the \`https://tuner.pandora.com/*\` host permission at install, that \`storage.session\` exists and the background is an event page, refused an email not on the access allow-list without asking Pandora, repeated the login/stations proof against the tuner, started a station with no tab (the background page holds the \`<audio>\`; after 45 s with no extension page open at all the state was still playing with the position advanced, \`audio.noPage\`; the optional player tab showed the track and its closing changed nothing; the spacegho.st sign-in and sign-out; access withdrawn stopped the music and signed out of Pandora), and then reset the endpoint to Pandora and signed in with bogus credentials (listed on the fake access server): tuner.pandora.com itself answered \`auth.userLogin\` with code 1002 and the popup said \"Pandora rejected auth.userLogin (code 1002: invalid login). Wrong email address or password.\" (\`smoke-firefox-real-pandora.png\`); \`smoke-firefox-node-probe.json\` is the same no-account probe from Node with the client and wasm core alone. That is the only contact with Pandora in CI: no job signs in to a real account, so stations and playback against Pandora remain unproven here. The signed .xpi and the .crx files were packaged from the same dist/ but no job installed those files themselves in a browser; the full bridge (relay round trip, remote control, session sharing) was proven in Chromium and Brave. Cold start, in all three: with \"remember me\" on and no extension page ever opened afterwards, a page on https://spacegho.st/melodica/app/ (served locally) saw \`present\`/\`ready\` within 1 s, got a signed-in state with stations, and played and paused a station over the bridge, after a browser restart and after the service worker was stopped in chrome://serviceworker-internals (Chromium, Brave), and after an add-on reload and a stopped background page (Firefox: a temporary add-on does not survive a browser restart); \`coldStart\` in each report. Nothing is on any store: the AMO signature (when present) is on the unlisted channel, which signs the file and lists nothing; there is no Chrome Web Store or Edge Add-ons item and there will not be one (docs/STORES.md)."
          } > release/RELEASE_BODY.md
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: melodica-extension-${{ steps.v.outputs.version }}
          path: release/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.v.outputs.version }}
          path: dist/
      # The Node bundles of the core wrapper and the Pandora client, for the no-account
      # probe against the real tuner.pandora.com in smoke-firefox (scripts/real-pandora-probe.mjs).
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ steps.v.outputs.version }}
          path: |
            build/node/
            build/core/melodica_core.wasm

  # Real-browser proof against melodica-tuner: options, popup login, stations,
  # playback in the player tab, and the bridge for the melodica-web page.
  smoke:
    needs: build
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        timeout-minutes: 15
        run: |
          npm install --no-audit --no-fund
          npx playwright install ${{ runner.environment == 'self-hosted' && '--with-deps' || '' }} chromium
          for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq xvfb && break; sleep 20; done
      - uses: Spaceghost/melodica-tuner@v1
        id: tuner
        with:
          user: ci@example.com
          password: ci-secret
          hosts-override: false
          ads: 1
          install-ca: false
      - name: Browser smoke test (built extension, melodica-tuner)
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npx playwright test
        env:
          TUNER_HTTPS_URL: ${{ steps.tuner.outputs.https-url }}
          TUNER_HTTP_URL: ${{ steps.tuner.outputs.http-url }}
          TUNER_USER: ${{ steps.tuner.outputs.user }}
          TUNER_PASSWORD: ${{ steps.tuner.outputs.password }}
          MELODICA_EXT_DIST: dist/chrome
      - name: Show the report
        if: always()
        run: cat tests/artifacts/smoke-extension.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-extension
          path: |
            tests/artifacts/smoke-extension.json
            tests/artifacts/smoke-extension-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-extension-playwright
          path: tests/artifacts/playwright/
          if-no-files-found: ignore

  # The same proof in Brave (installed from Brave's apt repository, unpinned, so the
  # job sees whatever Brave ships today) with Shields at their defaults. The report
  # lists every request Brave blocked; the job fails if one of them was ours.
  smoke-brave:
    needs: build
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Brave (brave-browser-apt-release.s3.brave.com) and Playwright
        timeout-minutes: 15
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq brave-browser xvfb && break; sleep 20; done
          brave-browser --version
          npm install --no-audit --no-fund
      - uses: Spaceghost/melodica-tuner@v1
        id: tuner
        with:
          user: ci@example.com
          password: ci-secret
          hosts-override: false
          ads: 1
          install-ca: false
      - name: Browser smoke test (built extension in Brave, melodica-tuner)
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npx playwright test
        env:
          TUNER_HTTPS_URL: ${{ steps.tuner.outputs.https-url }}
          TUNER_HTTP_URL: ${{ steps.tuner.outputs.http-url }}
          TUNER_USER: ${{ steps.tuner.outputs.user }}
          TUNER_PASSWORD: ${{ steps.tuner.outputs.password }}
          MELODICA_EXT_DIST: dist/chrome
          MELODICA_BROWSER: brave
          MELODICA_BROWSER_PATH: /usr/bin/brave-browser
      - name: Show the report
        if: always()
        run: |
          cat tests/artifacts/smoke-brave.json || true
          node -e 'const r=require("./tests/artifacts/smoke-brave.json"); if (r.ok!==true) { console.error("smoke-brave.json is not ok"); process.exit(1); }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-brave
          path: |
            tests/artifacts/smoke-brave.json
            tests/artifacts/smoke-brave-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-brave-playwright
          path: tests/artifacts/playwright/
          if-no-files-found: ignore

  # Real Mozilla Firefox (packages.mozilla.org, unpinned) driven through geckodriver +
  # selenium-webdriver with the dist/firefox build installed as a temporary add-on:
  # the tuner proof (options, popup login, stations, playback), then the no-account
  # probe against the real tuner.pandora.com, where bogus credentials must come back
  # as code 1002 both from Node (the client + wasm core alone) and from the installed
  # extension's popup. This is the only job that talks to Pandora itself.
  smoke-firefox:
    needs: build
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: node-${{ needs.build.outputs.version }}
          path: build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mozilla Firefox (packages.mozilla.org), geckodriver, a PulseAudio null sink
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | sudo tee /etc/apt/sources.list.d/mozilla.list
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/mozilla
          for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq firefox pulseaudio pulseaudio-utils && break; sleep 20; done
          firefox --version
          v="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/mozilla/geckodriver/releases/latest | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>console.log(JSON.parse(s).tag_name))')"
          curl -fsSL "https://github.com/mozilla/geckodriver/releases/download/$v/geckodriver-$v-linux64.tar.gz" | sudo tar -xz -C /usr/local/bin geckodriver
          geckodriver --version | head -1
          # Headless Firefox needs an audio sink for <audio> to progress; a null sink will do.
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci >/dev/null && pactl info | grep -i 'default sink'
          npm install --no-audit --no-fund
      - uses: Spaceghost/melodica-tuner@v1
        id: tuner
        with:
          user: ci@example.com
          password: ci-secret
          hosts-override: false
          ads: 1
          install-ca: false
      - name: Node probe against the real tuner.pandora.com (the client + wasm core, bogus credentials -> code 1002)
        run: |
          mkdir -p tests/artifacts
          node scripts/real-pandora-probe.mjs --core build/core/melodica_core.wasm --out tests/artifacts/smoke-firefox-node-probe.json
      - name: Firefox smoke test (dist/firefox as a temporary add-on, melodica-tuner, then real Pandora)
        run: node tests/smoke-firefox.mjs
        env:
          TUNER_HTTPS_URL: ${{ steps.tuner.outputs.https-url }}
          TUNER_HTTP_URL: ${{ steps.tuner.outputs.http-url }}
          TUNER_USER: ${{ steps.tuner.outputs.user }}
          TUNER_PASSWORD: ${{ steps.tuner.outputs.password }}
          MELODICA_EXT_DIST: dist/firefox
      - name: Show the report
        if: always()
        run: |
          cat tests/artifacts/smoke-firefox.json || true
          node -e 'const r=require("./tests/artifacts/smoke-firefox.json"); if (r.ok!==true) { console.error("smoke-firefox.json is not ok"); process.exit(1); }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-firefox
          path: |
            tests/artifacts/smoke-firefox.json
            tests/artifacts/smoke-firefox-*.png
            tests/artifacts/smoke-firefox-node-probe.json
          if-no-files-found: error

  release:
    needs: [build, smoke, smoke-brave, smoke-firefox]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: melodica-extension-${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: smoke-extension
      - uses: actions/download-artifact@v4
        with:
          name: smoke-brave
      - uses: actions/download-artifact@v4
        with:
          name: smoke-firefox
      - name: Check the three proofs and extend SHA256SUMS
        run: |
          for f in smoke-extension.json smoke-brave.json smoke-firefox.json; do
            node -e 'const f=process.argv[1]; const r=require("./"+f); console.log(f+": "+r.browser+" :: "+r.summary); if (r.ok!==true) { console.error(f+" is not ok"); process.exit(1); }' "$f"
          done
          node -e 'const r=require("./smoke-firefox-node-probe.json"); console.log("node probe: "+r.summary); if (r.ok!==true || !r.userLogin || r.userLogin.code!==1002) { console.error("the Node probe did not get code 1002"); process.exit(1); }'
          node -e 'const r=require("./smoke-firefox.json"); if (!r.realPandora || r.realPandora.code!==1002) { console.error("the Firefox run did not get code 1002 from Pandora"); process.exit(1); }'
          ls smoke-extension-slot.png smoke-extension-access-request.png smoke-extension-account.png
          ls smoke-extension-playing.png smoke-extension-popup-playing.png smoke-extension-player-tab.png smoke-extension-player-tab-dark.png smoke-extension-options.png smoke-extension-bridge.png
          ls smoke-brave-slot.png smoke-brave-access-request.png smoke-brave-account.png smoke-brave-login.png smoke-brave-stations.png smoke-brave-playing.png smoke-brave-popup-playing.png smoke-brave-player-tab.png smoke-brave-player-tab-dark.png smoke-brave-options.png smoke-brave-bridge.png
          ls smoke-firefox-slot.png smoke-firefox-access-request.png smoke-firefox-account.png smoke-firefox-login.png smoke-firefox-stations.png smoke-firefox-playing.png smoke-firefox-popup-playing.png smoke-firefox-player-tab.png smoke-firefox-real-pandora.png
          for f in smoke-extension.json smoke-brave.json smoke-firefox.json; do
            node -e 'const f=process.argv[1]; const a=require("./"+f).audio; if (!a || !a.noPage || a.noPage.after.status!=="playing" || !a.playerTab || a.playerTab.afterClose.status!=="playing") { console.error(f+": background playback not proven"); process.exit(1); } console.log(f+": background playback ok ("+a.engine+")")' "$f"
          done
          for f in smoke-extension.json smoke-brave.json smoke-firefox.json; do
            node -e 'const f=process.argv[1]; const u=require("./"+f).update; if (f!=="smoke-firefox.json" && (!u || !u.banner || !/99\.0\.0 is available/.test(u.banner.text))) { console.error(f+": update banner missing"); process.exit(1); } const d=(require("./"+f).spots||{}).defaultPolicy; if (!d || !(d.metadataFetched>0) || !(d.audioFetched>0) || !(d.registered>0) || d.nextRefused!==true) { console.error(f+": slot playback not proven"); process.exit(1); } const ac=require("./"+f).access; if (!ac || !ac.notListed || ac.notListed.userLogin!==0 || !ac.withdrawn || ac.withdrawn.loggedIn!==false) { console.error(f+": access check not proven"); process.exit(1); } const acc=require("./"+f).account; if (!acc || acc.label!=="octo-ci") { console.error(f+": spacegho.st sign-in not proven"); process.exit(1); } console.log(f+": slot fetched, played and registered; access and sign-in ok")' "$f"
          done
          for f in smoke-extension.json smoke-brave.json; do
            node -e 'const f=process.argv[1]; const r=require("./"+f); if (!r.remember || r.remember.passwordInStorage!==false || r.remember.key!=="secret/false/AES-GCM") { console.error(f+": sealed password not proven"); process.exit(1); } const s=r.session; if (!s || !s.get || !s.refusedFromExtensionPage || !s.logoutBoth || !s.revoked || !s.offerSignedIn || !s.kept || !s.accountSignoutPending) { console.error(f+": session sharing not proven"); process.exit(1); } console.log(f+": password sealed; session shared both ways")' "$f"
            node -e 'const f=process.argv[1]; const u=require("./"+f).username; if (!u || u.chosen!=="night_owl" || u.changed!=="night_owl_2") { console.error(f+": username not proven"); process.exit(1); } console.log(f+": username picked and changed")' "$f"
            node -e 'const f=process.argv[1]; const c=require("./"+f).scrobbles; if (!c || !c.notice || !(c.playingNow>0) || c.slotScrobbled!==false || !c.optOut) { console.error(f+": scrobbling not proven"); process.exit(1); } console.log(f+": scrobbles sent, no slot, opt-out ok")' "$f"
            node -e 'const f=process.argv[1]; const u=require("./"+f).scrobbleUi; if (!u || !u.listens || !u.leaderboard || !u.mapHidden || !/^[0-9a-f]{40}$/.test(u.pin)) { console.error(f+": scrobble panels not proven"); process.exit(1); } console.log(f+": scrobble-ui "+u.pin+": listens, leaderboard")' "$f"
            node -e 'const f=process.argv[1]; const r=require("./"+f).rooms; if (!r || r.result!=="passed" || !r.popupProgress || !r.fullPlayerProgress || !r.singleTransport || !r.roomDetailsBelowPlayer || !r.tabsSurviveRoomUpdates) { console.error(f+": complete room player UI not proven"); process.exit(1); }' "$f"
            node -e 'const f=process.argv[1]; const c=require("./"+f).coldStart; const okr=(r)=>r && r.detectedMs<1000 && r.stations>0 && r.played && r.paused && r.extensionPages.length===0; if (!c || !c.ok || !okr(c.restart) || !okr(c.workerStopped) || c.restart.offscreenBeforePlay!==0) { console.error(f+": cold start not proven"); process.exit(1); } console.log(f+": cold start: page found the extension in "+c.restart.detectedMs+" ms after a restart, "+c.workerStopped.detectedMs+" ms after the worker stopped")' "$f"
            node -e 'const f=process.argv[1]; const r=require("./"+f).resume; const near=(x)=>x && x.sameTrack && x.status==="playing" && Math.abs(x.resumedAt-x.saved)<1.5; if (!r || !r.ok || !near(r.offscreenAndWorker) || !near(r.restart) || !near(r.expiredWithCopy) || !r.expiredWithCopy.continued || !r.expiredNoCopy || !r.expiredNoCopy.continued) { console.error(f+": resume not proven"); process.exit(1); } console.log(f+": resume at "+r.restart.resumedAt.toFixed(1)+" s after a restart; expired link played the audio copy, then the station")' "$f"
          done
          node -e 'const f=process.argv[1]; const c=require("./"+f).coldStart; const okr=(r)=>r && r.detectedMs<1000 && r.stations>0 && r.played && r.paused && r.extensionPages.length===0; if (!c || !c.ok || !okr(c.restart) || !okr(c.workerStopped)) { console.error(f+": cold start not proven"); process.exit(1); } console.log(f+": cold start: page found the extension in "+c.restart.detectedMs+" ms after a restart, "+c.workerStopped.detectedMs+" ms after the worker stopped")' smoke-firefox.json
          sha256sum smoke-extension.json smoke-extension-*.png smoke-brave.json smoke-brave-*.png smoke-firefox.json smoke-firefox-*.png smoke-firefox-node-probe.json >> SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: melodica-extension ${{ needs.build.outputs.version }}
          body_path: RELEASE_BODY.md
          files: |
            melodica-extension-${{ needs.build.outputs.version }}-chrome.zip
            melodica-extension-${{ needs.build.outputs.version }}-firefox.zip
            melodica-extension-${{ needs.build.outputs.version }}.xpi
            melodica-extension-${{ needs.build.outputs.version }}.crx
            melodica-extension-${{ needs.build.outputs.version }}-src.tar.gz
            SHA256SUMS
