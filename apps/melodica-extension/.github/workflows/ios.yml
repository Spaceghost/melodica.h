# iPhone / iPad build: the Safari Web Extension in its containing app, built on
# GitHub's macOS runner (the only Mac this project has). Private repository, so
# macOS minutes bill at 10x: tags and manual runs only, one macOS job, no matrix.
#
#   web     (ubuntu)  wasm core + extension build, scripts/package.sh safari -> dist/safari
#   ios     (macOS)   xcodebuild for device (unsigned .ipa) and simulator; simulator proof
#   attach  (ubuntu)  on v* tags: waits for ci.yml's release and uploads the iOS assets to it
#
# Nothing here publishes anywhere: no App Store, no App Review, no TestFlight. The .ipa is
# unsigned and is installed by sideloading (README "iPhone and iPad").
name: ios
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  NELUA_REPO: https://github.com/Spaceghost/nelua-lang
  NELUA_SHA: 7fe8132893f9f2bbce3a7b23247ad8bde2c216ed

jobs:
  web:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: nelua
        with:
          path: ${{ runner.temp }}/nelua-lang
          key: nelua-${{ runner.os }}-${{ env.NELUA_SHA }}
      - name: Toolchain (clang + lld for wasm32, Jack's Nelua fork)
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update -qq && sudo apt-get install -y -qq lld clang && break; sleep 20; done
          if [[ ! -x "$RUNNER_TEMP/nelua-lang/nelua" ]]; then
            rm -rf "$RUNNER_TEMP/nelua-lang"
            git clone -q "$NELUA_REPO" "$RUNNER_TEMP/nelua-lang"
            git -C "$RUNNER_TEMP/nelua-lang" checkout -q "$NELUA_SHA"
            make -C "$RUNNER_TEMP/nelua-lang" -j"$(nproc)" >/dev/null
          fi
          "$RUNNER_TEMP/nelua-lang/nelua" --version
      - name: Build the wasm core, the extension, dist/safari
        env:
          NELUA: ${{ runner.temp }}/nelua-lang/nelua
        run: |
          scripts/build-core.sh
          npm install --no-audit --no-fund
          node scripts/build.mjs --version "${{ steps.v.outputs.version }}"
          OUT="$PWD/release" scripts/package.sh safari "${{ steps.v.outputs.version }}"
          cat dist/safari/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-safari-${{ steps.v.outputs.version }}
          path: dist/safari/

  ios:
    needs: web
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      V: ${{ needs.web.outputs.version }}
      # Ad hoc signing hook (inactive until these secrets exist; ios/README.md). Secrets are
      # not allowed in a step's if:, so the check lives here, as ci.yml does with HAS_AMO.
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERT_P12 != '' && secrets.IOS_CERT_PASSWORD != '' && secrets.IOS_PROVISION_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-safari-${{ needs.web.outputs.version }}
          path: dist/safari
      - name: Xcode
        run: xcodebuild -version; xcrun --show-sdk-version --sdk iphoneos
      # One-time: the Xcode project is generated by Apple's converter and committed under
      # ios/. This step only runs when it is missing, and uploads what it generated.
      - name: Generate the Xcode project (only when ios/melodica is missing)
        id: gen
        run: |
          if [[ -d ios/melodica ]]; then echo "generated=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          xcrun safari-web-extension-converter dist/safari --project-location ios --ios-only --no-open --no-prompt \
            --bundle-identifier st.spacegho.melodica --app-name melodica
          find ios -maxdepth 3 | sort
          echo "generated=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.gen.outputs.generated == 'yes'
        with:
          name: ios-project-generated
          path: ios/
      - name: Build for device (arm64, unsigned) and package the .ipa
        run: ios/scripts/build.sh device
      - name: Build for the simulator
        run: ios/scripts/build.sh simulator
      - name: Signed ad hoc .ipa (only when IOS_CERT_P12/IOS_CERT_PASSWORD/IOS_PROVISION_PROFILE exist)
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: ios/scripts/sign-adhoc.sh "release/melodica-$V-unsigned.ipa" "release/melodica-$V-adhoc.ipa"
      - uses: Spaceghost/melodica-tuner@v1
        id: tuner
        with:
          user: ci@example.com
          password: ci-secret
          hosts-override: false
          install-ca: false
      - name: Simulator proof (install, launch, extension registered, Safari)
        env:
          TUNER_HTTPS_URL: ${{ steps.tuner.outputs.https-url }}
          TUNER_HTTP_URL: ${{ steps.tuner.outputs.http-url }}
          TUNER_CA: ${{ steps.tuner.outputs.ca-path }}
        run: |
          ios/scripts/sim-smoke.sh build/sim/melodica.app "$V"
          node -e 'const r=require("./tests/artifacts/smoke-ios.json"); if (r.ok!==true) { console.error("smoke-ios.json is not ok"); process.exit(1); }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ needs.web.outputs.version }}
          path: |
            release/*.ipa
            tests/artifacts/smoke-ios.json
            tests/artifacts/smoke-ios-*.png
            tests/artifacts/smoke-ios-discovery.txt
          if-no-files-found: warn

  attach:
    needs: [web, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    env:
      V: ${{ needs.web.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ios-${{ needs.web.outputs.version }}
          path: ios-assets
      - name: Wait for ci.yml's release (it creates the release and SHA256SUMS)
        run: |
          for i in $(seq 1 55); do
            if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then exit 0; fi
            sleep 60
          done
          echo "::error::no release with SHA256SUMS for $GITHUB_REF_NAME after 55 minutes"; exit 1
      - name: Upload the .ipa and the simulator proof; extend SHA256SUMS and the notes
        run: |
          mkdir up && cp ios-assets/release/*.ipa ios-assets/tests/artifacts/smoke-ios.json ios-assets/tests/artifacts/smoke-ios-*.png up/
          cd up
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS
          grep -v -E ' (melodica-.*\.ipa|smoke-ios.*)$' SHA256SUMS > S || true
          sha256sum *.ipa smoke-ios.json smoke-ios-*.png >> S && mv S SHA256SUMS && cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --clobber *.ipa smoke-ios.json smoke-ios-*.png SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --json body -q .body > body.md
          if ! grep -q '^## iPhone and iPad' body.md; then
            summary="$(node -e 'console.log(require("./smoke-ios.json").summary)')"
            {
              echo; echo "## iPhone and iPad"; echo
              echo "- \`melodica-$V-unsigned.ipa\`: the containing app with the Safari Web Extension, built by ios.yml on GitHub's macOS runner with signing off. Sideload it with SideStore or AltStore and your own Apple ID (it re-signs the app; free accounts refresh every 7 days), then Settings → Apps → Safari → Extensions → melodica → on, and allow it on tuner.pandora.com and spacegho.st. Requires GitHub sign-in. Not on the App Store or TestFlight. Instructions: README \"iPhone and iPad\"."
              [[ -f "melodica-$V-adhoc.ipa" ]] && echo "- \`melodica-$V-adhoc.ipa\`: the same app signed ad hoc for the devices in the provisioning profile."
              echo "- \`smoke-ios.json\`, \`smoke-ios-*.png\`: simulator proof. $summary. No real iPhone or iPad installed this file in CI."
            } >> body.md
            gh release edit "$GITHUB_REF_NAME" --notes-file body.md
          fi
