plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'st.spacegho.melodica.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'st.spacegho.melodica.mobile'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('player-assets'))
    sourceSets.main.assets.srcDir('../shared')
}

def player = file('../../dist')
tasks.register('packagePlayer', Sync) {
    from(player) { into 'player' }
    into(layout.buildDirectory.dir('player-assets'))
    doFirst {
        if (!new File(player, 'melodica.wasm').isFile() || !new File(player, 'mobile.js').isFile())
            throw new GradleException('Build the web player with scripts/build.sh first.')
    }
}
tasks.named('preBuild') { dependsOn 'packagePlayer' }
