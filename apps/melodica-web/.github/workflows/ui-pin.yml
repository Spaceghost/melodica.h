name: shared UI pin
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: shared-ui-pin
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, fedora]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and update the shared UI pin
        run: |
          curl -fsS --retry 3 -A melodica-ci https://spacegho.st/scrobble/assets/ui/latest.json -o "$RUNNER_TEMP/shared-ui-latest.json"
          node scripts/update-ui-pin.mjs "$RUNNER_TEMP/shared-ui-latest.json"
      - name: Publish the pin when the branch is quiet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- scrobble-ui.pin && exit 0
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" || exit 0
          changed_at=$(git log -1 --format=%ct origin/master)
          test "$(( $(date +%s) - changed_at ))" -ge 900 || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scrobble-ui.pin
          git commit -m 'Refresh the shared UI content pin'
          git push origin HEAD:master
          # Token-authenticated pushes need explicit dispatch to start validation.
          gh workflow run ci.yml --ref master
          gh workflow run browser.yml --ref master
