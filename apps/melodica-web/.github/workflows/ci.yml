name: ci
on:
  push:
    branches: [master]
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the shared Scrobbles UI (pinned, sha256-checked)
        run: scripts/fetch-scrobble-ui.sh
      - name: The shared UI pin is at most one release behind live
        # Exit 1 (more than one release behind) fails; exit 2 (latest.json unreachable) warns.
        run: |
          rc=0
          curl -fsS --retry 3 -A melodica-ci https://spacegho.st/scrobble/assets/ui/latest.json -o latest.json || rc=2
          [ "$rc" = 0 ] && { node scripts/check-ui-pin.mjs web/vendor/scrobble-ui/scrobble-ui.js latest.json || rc=$?; }
          if [ "$rc" = 2 ]; then echo "::warning::latest.json unreachable; ui pin not checked"; exit 0; fi
          exit $rc
      - name: Build dist/
        run: scripts/build.sh
      - name: Static checks
        run: scripts/check.sh
      - name: Node smoke test (partner login through the live relay)
        run: node tests/node-smoke.mjs
        env:
          MELODICA_SMOKE_ALLOW_RELAY_BLOCK: '1'
      - name: Node unit test (canned Pandora responses)
        run: node tests/node-unit.mjs
      - name: Bridge unit test (fake window, no network)
        run: node tests/bridge-unit.mjs
      - name: Account unit test (PKCE, tokens, policy; no network)
        run: node tests/account-unit.mjs
      - name: Inserts unit test (canned answers, no network)
        run: node tests/inserts-unit.mjs
      - name: Scrobble unit test (threshold, tracker, API calls; no network)
        run: node tests/scrobble-unit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
