# Real-browser test (Playwright, Chromium): the client loads under the site's
# CSP, the wasm module instantiates, the login form renders, and a wrong
# password travels wasm -> relay -> Pandora and comes back as an error in the UI.
#
# On push/PR the test runs against dist/ built here, served by a local static
# server, with the live relay. GitHub runners are answered by a Cloudflare
# challenge instead of the relay, so that last step is reported as skipped
# ("not provable here") rather than failing; the full path is proven from
# other networks (see tests/browser.spec.mjs and the README).
#
# The smoke job proves the full flow (login, station list, playback) against
# melodica-tuner, a stand-in tuner.pandora.com, in headless Chromium.
#
# workflow_dispatch can also point the test at the hosted page.
name: browser
on:
  push:
    branches: [master]
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:
    inputs:
      hosted:
        description: 'Also run against the hosted page (https://spacegho.st/melodica/app/)'
        type: boolean
        default: false

jobs:
  local-dist:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the shared Scrobbles UI (pinned, sha256-checked)
        run: scripts/fetch-scrobble-ui.sh
      - name: Build dist/
        run: scripts/build.sh
      - name: Static checks
        run: scripts/check.sh
      - name: Install Playwright
        # No `--with-deps`: it apt-installs only extra fonts on ubuntu-latest
        # (every library Chromium needs is already there) and the Azure apt
        # mirror has hung that step for 6 h (run 42105334837) and crawled at
        # 30 kB/s (run 42277935990). The browser itself comes from
        # Playwright's CDN.
        timeout-minutes: 15
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Browser test (local dist, live relay)
        run: npx playwright test tests/browser.spec.mjs
        env:
          MELODICA_BROWSER_ALLOW_RELAY_BLOCK: '1'
      - name: Browser test (extension bridge with a fake content script)
        run: npx playwright test tests/bridge.spec.mjs
        env:
          MELODICA_BROWSER_ALLOW_RELAY_BLOCK: '1'
      - name: Browser test (spacegho.st sign-in against a local account server, no network)
        run: npx playwright test tests/account.spec.mjs
      - name: Browser test (remote mode against a fake background player, no network)
        run: npx playwright test tests/remote.spec.mjs
      - name: Design screenshots (every view at 390x844 and 1280x800, one centered column)
        run: npx playwright test tests/design.spec.mjs
      - name: Design against v0.4.0 (the player at 1920x1080 and 2560x1440 next to the v0.4.0 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v040"
          gh release download v0.4.0 -R "$GITHUB_REPOSITORY" -p 'melodica-web-0.4.0.tar.gz' -D "$RUNNER_TEMP/v040"
          tar xzf "$RUNNER_TEMP/v040/melodica-web-0.4.0.tar.gz" -C "$RUNNER_TEMP/v040"
          MELODICA_V040_DIST="$RUNNER_TEMP/v040/dist" npx playwright test tests/design-v040.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-local-dist
          path: tests/artifacts/
          if-no-files-found: ignore

  smoke:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the shared Scrobbles UI (pinned, sha256-checked)
        run: scripts/fetch-scrobble-ui.sh
      - name: Build dist/
        run: scripts/build.sh
      - name: Install Playwright
        # No `--with-deps`: it apt-installs only extra fonts on ubuntu-latest
        # (every library Chromium needs is already there) and the Azure apt
        # mirror has hung that step for 6 h (run 42105334837) and crawled at
        # 30 kB/s (run 42277935990). The browser itself comes from
        # Playwright's CDN.
        timeout-minutes: 15
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - uses: Spaceghost/melodica-tuner@v1
        id: tuner
        with:
          user: ci@example.com
          password: ci-secret
          hosts-override: false
          install-ca: false
      - name: Browser smoke test (local dist, melodica-tuner)
        run: npx playwright test tests/smoke-tuner.spec.mjs
        env:
          TUNER_HTTPS_URL: ${{ steps.tuner.outputs.https-url }}
          TUNER_HTTP_URL: ${{ steps.tuner.outputs.http-url }}
          TUNER_USER: ${{ steps.tuner.outputs.user }}
          TUNER_PASSWORD: ${{ steps.tuner.outputs.password }}
      - name: Playback flags smoke test (local dist, melodica-tuner, account policy)
        run: npx playwright test tests/smoke-playback.spec.mjs
        env:
          TUNER_HTTPS_URL: ${{ steps.tuner.outputs.https-url }}
          TUNER_HTTP_URL: ${{ steps.tuner.outputs.http-url }}
          TUNER_USER: ${{ steps.tuner.outputs.user }}
          TUNER_PASSWORD: ${{ steps.tuner.outputs.password }}
      - name: Tuner report (the insert steps must be in the tuner's log)
        run: |
          # The tuner repository is private; use the copy the runner fetched for the action.
          cd "$RUNNER_WORKSPACE/../_actions/Spaceghost/melodica-tuner/v1"
          python3 -m tuner.report --platform web --ok --summary "melodica-web playback flags against melodica-tuner" \
            --from-log "${{ steps.tuner.outputs.log-url }}" \
            --require "ad.getAdMetadata ok" --require "ad audio fetched" --require "ad.registerAd ok" \
            --out "$GITHUB_WORKSPACE/tests/artifacts/smoke-web-playback-report.json"
          cat "$GITHUB_WORKSPACE/tests/artifacts/smoke-web-playback-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Show the report
        if: always()
        run: cat tests/artifacts/smoke-web.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-web
          path: |
            tests/artifacts/smoke-web.json
            tests/artifacts/smoke-playback.json
            tests/artifacts/smoke-web-*.json
            tests/artifacts/smoke-web-*.png
            tests/artifacts/playwright/
          if-no-files-found: ignore


  # The real extension needs its released Chrome build. spacegho.st answers GitHub's
  # hosted runners with a Cloudflare 403 and the extension's repository is private,
  # so this job runs on the bak runner (gh-runners container), which can download
  # https://spacegho.st/extensions/dl/… like any browser.
  extension-real:
    needs: smoke
    runs-on: [self-hosted, linux, x64, fedora]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        timeout-minutes: 15
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - uses: Spaceghost/melodica-tuner@v1
        id: tuner
        with:
          user: ci@example.com
          password: ci-secret
          hosts-override: false
          install-ca: false
          # The bak runner container is shared; 8443/8080 may be taken by another repo's job.
          https-port: "28443"
          http-port: "28080"
      - name: The real melodica extension (latest release from spacegho.st/extensions), the page as its remote
        run: |
          ver=$(curl -fsSL https://spacegho.st/extensions/dl/melodica-extension/update.xml | grep -o '<updatecheck [^>]*' | grep -o 'version="[^"]*"' | cut -d'"' -f2)
          echo "melodica-extension $ver"
          rm -rf "$RUNNER_TEMP/ext" && mkdir -p "$RUNNER_TEMP/ext"
          curl -fsSL -o "$RUNNER_TEMP/ext.zip" "https://spacegho.st/extensions/dl/melodica-extension/v$ver/melodica-extension-$ver-chrome.zip"
          unzip -q "$RUNNER_TEMP/ext.zip" -d "$RUNNER_TEMP/ext"
          MELODICA_EXT_DIR="$RUNNER_TEMP/ext" npx playwright test tests/extension-real.spec.mjs
        env:
          TUNER_HTTPS_URL: ${{ steps.tuner.outputs.https-url }}
          TUNER_HTTP_URL: ${{ steps.tuner.outputs.http-url }}
          TUNER_USER: ${{ steps.tuner.outputs.user }}
          TUNER_PASSWORD: ${{ steps.tuner.outputs.password }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-real
          path: |
            tests/artifacts/extension-real.json
            tests/artifacts/extension-real-*.png
            tests/artifacts/playwright/
          if-no-files-found: ignore

  hosted:
    if: github.event_name == 'workflow_dispatch' && inputs.hosted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        # No `--with-deps`: it apt-installs only extra fonts on ubuntu-latest
        # (every library Chromium needs is already there) and the Azure apt
        # mirror has hung that step for 6 h (run 42105334837) and crawled at
        # 30 kB/s (run 42277935990). The browser itself comes from
        # Playwright's CDN.
        timeout-minutes: 15
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Browser test (hosted page)
        run: npx playwright test tests/browser.spec.mjs
        env:
          MELODICA_APP_URL: https://spacegho.st/melodica/app/
          MELODICA_BROWSER_ALLOW_RELAY_BLOCK: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-hosted
          path: tests/artifacts/
          if-no-files-found: ignore
