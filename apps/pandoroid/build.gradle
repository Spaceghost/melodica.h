// Minimal Gradle build for the legacy ant/SDK-tools era source layout.
// The native library is produced by ./build-native.sh (ndk-build via
// jni/Android.mk + jni/Application.mk) into libs/<abi>/libmelodica.so and
// packaged from there; this file does not duplicate the native build.
plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.aregner.android.pandoid'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aregner.android.pandoid'
        // versionCode/versionName come from AndroidManifest.xml.
        minSdk 21     // NDK floor; the Java code itself dates from API 8.
        targetSdk 23  // Android 14+ refuses targetSdk < 23; stays below the
                      // background-service (26) and cleartext (28) changes.
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            jniLibs.srcDirs = ['libs']
        }
    }

    useLibrary 'org.apache.http.legacy'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        ci {
            // Throwaway keystore generated by the release workflow.
            storeFile file(findProperty('ciKeystore') ?: 'ci.keystore')
            storePassword findProperty('ciKeystorePassword') ?: ''
            keyAlias findProperty('ciKeyAlias') ?: 'pandoroid-ci'
            keyPassword findProperty('ciKeyPassword') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (findProperty('ciKeystore')) {
                signingConfig signingConfigs.ci
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
