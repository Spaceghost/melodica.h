name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y libao-dev libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libcurl4-gnutls-dev libgcrypt20-dev libjson-c-dev libutf8proc-dev pkg-config build-essential
    - name: Build pianobar
      run: make
    - name: Scrobbler tests (unit + fake ListenBrainz server)
      run: |
          make test
          sh ci/listenbrainz-e2e.sh

